name: ETM CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Verify & Test ETM Core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Install Protoc Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Activate Protoc Plugin
        run: flutter pub global activate protoc_plugin 25.0.0

      - name: Install Pub Dependencies
        run: flutter pub get

      - name: Run Protobuf Generation
        run: ./scripts/generate_proto.sh

      - name: Run Build Runner Generation
        run: ./scripts/build.sh

      - name: Check Code Formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Run Flutter Static Analysis
        run: flutter analyze

      - name: Run Flutter Unit & Widget Tests
        run: flutter test
